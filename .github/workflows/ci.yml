name: CI
on:
  push: {branches: [main]}
  pull_request:
jobs:
  build-and-test:
    # tiktoken 0.5.1 has no Python 3.13 wheel and needs Rust to build, which the
    # Dockerfile already installs, so the tests run inside the built image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose run --rm --no-deps -e OPENAI_API_KEY= app uv run --with pytest pytest -q -p no:warnings tests
