services:
  app:
    build: .
    ports: ["${APP_PORT:-7860}:7860"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:7860')"]
      interval: 10s
      timeout: 3s
      retries: 20
